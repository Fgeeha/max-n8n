# Локальное окружение: n8n (regular mode) + postgres.
# Запуск: make up-local
#
# Отличия от прода: один процесс n8n без worker-ов и Redis, порт наружу,
# приём апдейтов через polling. Postgres тот же — чтобы схема и миграции
# проверялись там же, где потом поедут в прод.
#
# name фиксирует имя проекта Compose. Без него Compose берёт имя каталога
# ("docker") и склеивает стек с чужими проектами на той же машине:
# docker compose down -v тогда снесёт их тома.
name: max-n8n-local

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maxn8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxn8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Наружу только локально — удобно смотреть базу с хоста psql-ом.
      - "127.0.0.1:${DB_EXPOSED_PORT:-5433}:5432"

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.37.10}
    env_file:
      - ../.env
    environment:
      <<: &n8n_common
        DB_TYPE: postgresdb
        DB_POSTGRESDB_HOST: db
        DB_POSTGRESDB_PORT: 5432
        DB_POSTGRESDB_DATABASE: ${DB_NAME:-n8n}
        DB_POSTGRESDB_USER: ${POSTGRES_USER:-maxn8n}
        DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
        DB_POSTGRESDB_POOL_SIZE: ${DB_POSTGRESDB_POOL_SIZE:-10}
        N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY не задан в .env}
        GENERIC_TIMEZONE: ${TZ:-Europe/Moscow}
        TZ: ${TZ:-Europe/Moscow}
        N8N_LOG_LEVEL: ${LOG_LEVEL:-info}
        N8N_DIAGNOSTICS_ENABLED: "false"
        N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
        N8N_RUNNERS_TASK_TIMEOUT: "60"
        # Выражения читают $env.MAX_BOT_TOKEN — токен не попадает в базу n8n.
        N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
        # Корневой сертификат Минцифры добавляется К системным, а не вместо них.
        NODE_EXTRA_CA_CERTS: ${MAX_CA_BUNDLE:-}
        EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
        EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: "false"
      EXECUTIONS_MODE: regular
    volumes:
      - n8n_data_local:/home/node/.n8n
      - ../workflows:/workflows:ro
      - ../certs:/certs:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata_local:
  n8n_data_local:
