# Отдельное имя проекта обязательно: без него Compose берёт имя каталога
# ("docker") и склеивается с другими стеками на этой машине.
name: max-n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: max-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # --- ядро n8n ---
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-Europe/Moscow}
      TZ: ${TZ:-Europe/Moscow}
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Фиксируем значения, у которых n8n собирается менять дефолт.
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Разрешает выражениям читать $env.MAX_BOT_TOKEN, чтобы токен
      # не сохранялся в базе n8n и не попадал в экспорт сценариев.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Не обрезать историю выполнений сразу — нужна для отладки сценариев.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      # --- доступ к Bot API MAX ---
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?MAX_BOT_TOKEN не задан в .env}
      MAX_API_URL: ${MAX_API_URL:-https://botapi.max.ru}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../workflows:/workflows:ro

volumes:
  n8n_data:
